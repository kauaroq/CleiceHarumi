name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # ou o nome da sua branch principal (master)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inserir Firebase API Key
        # Esse comando substitui a apiKey vazia pela sua secret antes de fazer o deploy
        run: |
          sed -i "s/apiKey: ''/apiKey: '${{ secrets.FIREBASE_API_KEY }}'/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
